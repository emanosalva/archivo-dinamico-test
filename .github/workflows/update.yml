name: Actualizar reporte automáticamente

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-report]

jobs:
  update-file:
    runs-on: ubuntu-latest

    concurrency:
      group: actualizar-reporte
      cancel-in-progress: true

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - run: |
          echo "Reporte dinámico" > reporte.txt
          echo "Generado en: $(date +%s)" >> reporte.txt
          echo "Run ID: $RANDOM" >> reporte.txt

      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add reporte.txt
          git commit -m "Actualización automática" || exit 0
          git push
