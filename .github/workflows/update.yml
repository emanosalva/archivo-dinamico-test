name: Actualizar reporte automáticamente

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update-file:
    runs-on: ubuntu-latest

    concurrency:
      group: actualizar-reporte
      cancel-in-progress: true

    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar contenido del archivo
        run: |
          echo "Reporte dinámico" > reporte.txt
          echo "Generado en: $(date +%s)" >> reporte.txt
          echo "Run ID: $RANDOM" >> reporte.txt

      - name: Commit y push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add reporte.txt
          git commit -m "Actualización automática" || exit 0
          git push origin main
